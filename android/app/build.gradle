plugins { id 'com.android.application' version '8.7.2' }

// Internal render resolution for the Android port. game.toml ships "1080p"
// (5x supersampling), far too heavy for a phone GPU. Override at build time:
//   ./gradlew :app:assembleDebug -Phercules.internalResolution=720p
def herculesInternalResolution =
        (project.findProperty("hercules.internalResolution") ?: "native").toString()

android {
    namespace = "com.example.hercules"          // musi zgadzać się z Java package + manifest
    compileSdk  = 34
    ndkVersion  = "30.0.16248370"

    defaultConfig {
        applicationId   = "com.example.hercules" // ten sam identyfikator aplikacji (patrz android/README.md)
        minSdk          = 24                     // Vulkan ICD wymaga API 24+ (Scoped Storage); patrz Moduł 3.4
        targetSdk       = 34
        versionCode     = 1
        versionName     = "0.1.0"

        // Runtime display settings are persisted in settings.toml and supersede
        // game.toml; RuntimeFiles.ensureSettings() writes this value there.
        buildConfigField "String", "INTERNAL_RESOLUTION", "\"${herculesInternalResolution}\""

        externalNativeBuild {
            cmake {
                arguments << "-DANDROID_ABI=arm64-v8a"          // JEDYNE ABI w paczce (patrz Moduł 3)
                arguments << "-DHERCULES_PORT=${projectDir}/../../port"
                arguments << "-DHERCULES_VERSION=SCES-00891"    // wersja gry — angielska PAL (patrz Moduł 3.2)

                // Vulkan jest primary; GLES ES to fallback przełączany flagą PSX_SDL_BACKEND=SDL2.
                if (project.hasProperty("USE_GLES")) {
                    arguments << "-DPSX_ENABLE_VULKAN=OFF"
                    arguments << "-DPSX_SDL_BACKEND=SDL2"
                } else {
                    arguments << "-DPSX_ENABLE_VULKAN=ON"
                }
            }
        }

        // Otnij pozostałe ABI — tylko arm64-v8a w finalnym APK/AAB.
        ndk { abiFilters = ["arm64-v8a"] }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // Ship an optimized (CMake Release, -O2/-O3) build that is still
            // installable from the command line: sign with the debug keystore.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake { path = file("src/main/cpp/CMakeLists.txt") }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Uwaga: SDLActivity.java kopiujemy z PINNED checkoutu libsdl-org/SDL (patrz android/README.md),
    // a nie jako zależność Maven — framework psxrecomp NIE dostarcza android/. Brak zależności poniżej.
}

// --- Runtime data staged into the APK -----------------------------------------
// The psx-recomp runtime reads game.toml, bios/openbios.bin and aot/ from its
// working directory (see BootstrapActivity / RuntimeFiles). Stage the small
// (≈600 KB) payload from port/ into assets/runtime/ so the APK is self-contained;
// game.toml for SCES-00891 is the English PAL release this port builds.
def herculesPortDir = file("${projectDir}/../../port")
def runtimeAssetsRoot = file("${buildDir}/generated/runtimeAssets")

tasks.register("stageRuntimeAssets", Copy) {
    into new File(runtimeAssetsRoot, "runtime")
    from("${herculesPortDir}/versions/SCES-00891/game.toml") {
        filter { line ->
            line.replaceAll(/internal_resolution\s*=\s*"[^"]*"/,
                    'internal_resolution = "' + herculesInternalResolution + '"')
        }
    }
    from("${herculesPortDir}/versions/SCES-00891/aot") { into "aot" }
    from("${herculesPortDir}/psxrecomp/bios/openbios.bin") { into "bios" }
}

android.sourceSets.main.assets.srcDirs += [runtimeAssetsRoot]

// Ensure the payload is staged before assets are merged (task ordering is not
// guaranteed for dynamically registered tasks, so hook the merge tasks too).
tasks.matching { it.name == "preBuild" || (it.name.startsWith("merge") && it.name.endsWith("Assets")) }
        .configureEach { dependsOn("stageRuntimeAssets") }
